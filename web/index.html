<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Record, transcribe, cut and edit videos with your own Claude Code, on your own computer.">
<meta name="theme-color" content="#f3f3f1">
<title>Video Octopus</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/geist-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>/* Settings › General › Appearance: the theme, accent and sidebar before the stylesheets paint
   (web/appearance.js keeps this cache). A browser that last ran one of the old looks maps it the same way the server
   does: the dark looks to Dark, the light ones to Light, Edit Bay to Match system. */
(function () {
  var d = document.documentElement, DARK_LOOKS = /^(night|frost|control|cinema|split)$/, LIGHT_LOOKS = /^(paper|swiss|clay|atelier)$/;
  var theme = 'system', accent = 'orange', sidebar = 'labels';
  try {
    var c = JSON.parse(localStorage.getItem('studio.theme') || 'null');
    if (c && typeof c === 'object') {
      if (/^(light|dark|system)$/.test(c.theme)) theme = c.theme;
      if (/^(orange|blue|green|violet)$/.test(c.accent)) accent = c.accent;
      if (/^(icons|labels)$/.test(c.sidebar)) sidebar = c.sidebar;
    } else {
      var old = JSON.parse(localStorage.getItem('studio.look') || 'null');
      var look = old && old.look;
      if (DARK_LOOKS.test(look)) theme = 'dark'; else if (LIGHT_LOOKS.test(look)) theme = 'light';
    }
  } catch (e) {}
  var dark = theme === 'dark';
  try { if (theme === 'system') dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
  d.dataset.theme = dark ? 'dark' : 'light';
  d.dataset.accent = accent;
  d.dataset.rail = sidebar;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? '#0b0b0d' : '#f3f3f1';
})();</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/learning.css">
<link rel="stylesheet" href="/onboarding.css">
<link rel="stylesheet" href="/memory.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/packaging.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" title="All projects"><span class="logo" aria-hidden="true"><i></i></span>Video Octopus</a>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <div class="bar-right">
    <div class="usage" id="usage" hidden title="Your Claude plan's usage, as Claude Code reports it">
      <span>5h</span><i><b id="u5"></b></i><span>7d</span><i><b id="u7"></b></i>
    </div>
    <div class="chip" id="claudeChip">Checking the agent…</div>
    <div class="bar-actions" id="barActions"></div>
    <div class="bar-theme" id="barTheme"></div>
    <a class="gear" href="#/settings" title="Settings" aria-label="Settings"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></a>
  </div>
</header>
<main id="app"></main>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js" type="module"></script>
</body>
</html>
